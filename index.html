<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel & CSV Viewer & Order Cart</title>
  <!-- Include SheetJS Library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #1e293b;
      --primary-light: #334155;
      --accent: #10b981;
      --accent-hover: #059669;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --modal-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      margin-bottom: 16px;
      padding: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title {
      flex: 1;
      min-width: 250px;
    }

    h1 {
      margin: 0 0 6px 0;
      color: var(--primary);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.4;
    }

    /* Header Action Buttons Wrapper */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Database File Upload Button */
    .btn-db-custom {
      background-color: var(--accent);
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      user-select: none;
    }

    .btn-db-custom:hover {
      background-color: var(--accent-hover);
    }

    .btn-db-custom:active {
      transform: scale(0.97);
    }

    /* Header Cart Trigger Button */
    .cart-trigger-btn {
      position: relative;
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.15);
      transition: background 0.2s, transform 0.1s;
    }

    .cart-trigger-btn:hover {
      background-color: var(--primary-light);
    }

    .cart-trigger-btn:active {
      transform: scale(0.97);
    }

    .cart-badge {
      background-color: var(--accent);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      min-width: 20px;
      text-align: center;
    }

    .hidden-file-input {
      display: none;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 0 0 8px 0;
    }

    .file-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .file-name-label {
      font-size: 0.875rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      color: var(--text-main);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .btn {
      padding: 8px 14px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-danger {
      background-color: #ef4444;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    /* Responsive Table Wrapper */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      min-width: 500px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f8fafc;
      color: var(--primary-light);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background-color: #f8fafc;
    }

    /* Auto-expanding Quantity Input Style */
    .qty-input {
      min-width: 72px;
      width: 72px;
      padding: 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      background-color: #ffffff;
      transition: border-color 0.2s, width 0.15s ease-out;
      box-sizing: border-box;
    }

    .qty-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .status {
      font-weight: 600;
      font-size: 0.875rem;
      color: #ef4444;
    }

    /* Pagination Bar */
    .pagination-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .pagination-btns {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .page-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-main);
      flex: 1;
      max-width: 120px;
      text-align: center;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-btn:hover:not(:disabled) {
      background: #f1f5f9;
    }

    /* MODAL STYLING */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--modal-shadow);
      border: 1px solid var(--border);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .modal-backdrop.open .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .close-btn:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 2px solid var(--primary);
      background: #ffffff;
    }

    .cart-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
      word-break: break-word;
    }

    .cart-item-desc {
      font-size: 0.775rem;
      color: var(--text-muted);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .empty-cart {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 0;
      font-size: 0.9rem;
    }

    .price-tag {
      font-weight: 700;
      color: var(--accent-hover);
    }

    /* MEDIA QUERIES FOR TABLET & DESKTOP */
    @media (min-width: 640px) {
      body {
        padding: 20px;
      }

      h1 {
        font-size: 1.75rem;
      }

      .pagination-controls {
        flex-direction: row;
      }

      .pagination-btns {
        width: auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Database Viewer & Order Cart</h1>
      <p class="subtitle">Upload your Excel or CSV database file to begin viewing and ordering.</p>
    </div>
    <div class="header-actions">
      <!-- DATABASE FILE UPLOAD BUTTON (Supports .xlsx, .xls, .csv) -->
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden-file-input" />
      <label for="excelFile" class="btn-db-custom" title="Upload Database File">
        📁 Upload Database
      </label>

      <!-- VIEW CART ORDER BUTTON -->
      <button id="openCartModalBtn" class="cart-trigger-btn">
        🛒 View Order Cart
        <span id="cartBadge" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- Active Database Info Bar -->
  <div id="fileInfoCard" class="card" style="display: none;">
    <div class="file-status-bar">
      <div>
        <span style="font-weight: 600; color: var(--primary);">Active Source: </span>
        <span id="fileNameDisplay" class="file-name-label">No database loaded</span>
      </div>
      <div id="statusMessage" class="status"></div>
    </div>
  </div>

  <!-- Search Input Section -->
  <div id="searchCard" class="card" style="display: none;">
    <div class="section-title">Search Database</div>
    <input type="text" id="searchInput" placeholder="Search in Column A or B..." />
  </div>

  <!-- Search Results Table -->
  <div id="tableContainer" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h3 style="margin: 0; font-size: 1.1rem; color: var(--primary);">Search Results</h3>
      <span id="rowCount" style="font-size: 0.8rem; color: var(--text-muted);"></span>
    </div>

    <div class="table-responsive">
      <table id="dataTable">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-controls" id="paginationBar" style="display: none;">
      <span id="pageInfo">Page 1</span>
      <div class="pagination-btns">
        <button id="prevPageBtn" class="page-btn">← Previous</button>
        <button id="nextPageBtn" class="page-btn">Next →</button>
      </div>
    </div>
  </div>

  <!-- ORDER CART MODAL -->
  <div id="cartModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">🛒 Order Cart</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="clearCartBtn" class="btn btn-danger" style="display: none; padding: 4px 8px; font-size: 0.75rem;">Clear All</button>
          <button id="closeCartModalBtn" class="close-btn">&times;</button>
        </div>
      </div>

      <div id="cartItems" class="modal-body">
        <div class="empty-cart">Your cart is currently empty.<br>Search items and click "+ Add".</div>
      </div>

      <div id="cartSummary" class="modal-footer" style="display: none;">
        <div class="cart-total-row">
          <span>Total Price:</span>
          <span id="grandTotal">₱0.00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let parsedRows = [];     
    let filteredRows = [];   
    let cart = [];           

    const PAGE_SIZE = 50;    
    let currentPage = 1;

    let debounceTimer = null;

    // Helper: Formatter with Currency Commas
    function formatCurrency(amount) {
      return '₱' + Number(amount).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    // Auto-adjust width of input based on character length
    function adjustQtyInputWidth(input, baseMinPx = 72) {
      const valStr = String(input.value || '');
      const calculatedWidth = Math.max(baseMinPx, valStr.length * 13 + 38);
      input.style.width = calculatedWidth + 'px';
    }

    // Modal Control Logic
    const cartModal = document.getElementById('cartModal');
    const openCartModalBtn = document.getElementById('openCartModalBtn');
    const closeCartModalBtn = document.getElementById('closeCartModalBtn');

    openCartModalBtn.addEventListener('click', () => cartModal.classList.add('open'));
    closeCartModalBtn.addEventListener('click', () => cartModal.classList.remove('open'));

    // Close modal when clicking outside modal-content
    cartModal.addEventListener('click', (e) => {
      if (e.target === cartModal) cartModal.classList.remove('open');
    });

    // Read and Pre-process Excel / CSV File
    document.getElementById('excelFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileInfoCard = document.getElementById('fileInfoCard');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      fileInfoCard.style.display = 'block';
      fileNameDisplay.textContent = file.name;

      const reader = new FileReader();
      const isCsv = file.name.toLowerCase().endsWith('.csv');

      if (isCsv) {
        reader.onload = function(event) {
          requestAnimationFrame(() => {
            try {
              const textData = event.target.result;
              const workbook = XLSX.read(textData, { type: 'string' });
              processWorkbook(workbook, file.name);
            } catch (error) {
              showError('Error reading CSV file.');
            }
          });
        };
        reader.readAsText(file, 'UTF-8');
      } else {
        reader.onload = function(event) {
          requestAnimationFrame(() => {
            try {
              const data = new Uint8Array(event.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              processWorkbook(workbook, file.name);
            } catch (error) {
              showError('Error reading Excel file.');
            }
          });
        };
        reader.readAsArrayBuffer(file);
      }
    });

    function showError(msg) {
      const statusMsg = document.getElementById('statusMessage');
      statusMsg.style.color = '#ef4444';
      statusMsg.textContent = msg;
    }

    function processWorkbook(workbook, sourceName) {
      const statusMsg = document.getElementById('statusMessage');
      const tableContainer = document.getElementById('tableContainer');
      const tableHeader = document.getElementById('tableHeader');
      const searchCard = document.getElementById('searchCard');

      statusMsg.textContent = '';
      tableHeader.innerHTML = '';
      parsedRows = [];
      filteredRows = [];
      currentPage = 1;

      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

      if (rawRows.length === 0) {
        showError('Selected database is empty.');
        return;
      }

      // Build Table Header (Row 1)
      const headerRow = rawRows[0] || [];
      for (let colIndex = 0; colIndex < 4; colIndex++) {
        const th = document.createElement('th');
        th.textContent = headerRow[colIndex] !== undefined && headerRow[colIndex] !== '' 
          ? headerRow[colIndex] 
          : `Column ${String.fromCharCode(65 + colIndex)}`;
        tableHeader.appendChild(th);
      }
      const actionTh = document.createElement('th');
      actionTh.textContent = 'Action';
      tableHeader.appendChild(actionTh);

      // Pre-process rows into optimized objects for fast searching
      const bodyRows = rawRows.slice(1);
      parsedRows = bodyRows.map((row, idx) => {
        const colA = row[0] !== undefined ? String(row[0]) : '';
        const colB = row[1] !== undefined ? String(row[1]) : '';
        const colC = row[2] !== undefined ? String(row[2]) : '';
        const colD = row[3] !== undefined ? String(row[3]) : '';

        let price = 0;
        for (let str of [colC, colD, colB]) {
          if (str) {
            const cleaned = String(str).replace(/[^0-9.-]+/g, "");
            const num = parseFloat(cleaned);
            if (!isNaN(num)) {
              price = num;
              break;
            }
          }
        }

        return {
          id: idx,
          colA,
          colB,
          colC,
          colD,
          price,
          searchStr: (colA + ' ' + colB).toLowerCase()
        };
      });

      filteredRows = [...parsedRows];
      statusMsg.style.color = '#10b981';
      statusMsg.textContent = 'Loaded successfully!';

      renderTablePage();

      tableContainer.style.display = 'block';
      searchCard.style.display = 'block';
    }

    // Render Paginated Rows using DocumentFragment
    function renderTablePage() {
      const tableBody = document.getElementById('tableBody');
      const rowCountEl = document.getElementById('rowCount');
      const pageInfoEl = document.getElementById('pageInfo');
      const paginationBar = document.getElementById('paginationBar');
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');

      tableBody.innerHTML = '';

      const totalItems = filteredRows.length;
      const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const endIndex = Math.min(startIndex + PAGE_SIZE, totalItems);
      const pageSlice = filteredRows.slice(startIndex, endIndex);

      const fragment = document.createDocumentFragment();

      pageSlice.forEach((item) => {
        const tr = document.createElement('tr');

        // Cells for Cols A, B, C, D
        const tdA = document.createElement('td'); tdA.textContent = item.colA; tr.appendChild(tdA);
        const tdB = document.createElement('td'); tdB.textContent = item.colB; tr.appendChild(tdB);
        const tdC = document.createElement('td'); tdC.textContent = item.colC; tr.appendChild(tdC);
        const tdD = document.createElement('td'); tdD.textContent = item.colD; tr.appendChild(tdD);

        // Action Cell
        const actionTd = document.createElement('td');
        actionTd.style.whiteSpace = 'nowrap';

        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.min = '1';
        qtyInput.value = '1';
        qtyInput.className = 'qty-input';
        qtyInput.id = `qty-${item.id}`;

        qtyInput.addEventListener('input', () => adjustQtyInputWidth(qtyInput, 72));
        qtyInput.addEventListener('change', () => adjustQtyInputWidth(qtyInput, 72));

        const addBtn = document.createElement('button');
        addBtn.className = 'btn';
        addBtn.textContent = '+ Add';
        addBtn.style.marginLeft = '8px';
        addBtn.style.padding = '8px 16px';
        addBtn.onclick = () => {
          const qty = parseInt(qtyInput.value) || 1;
          addToCart(item, qty);
          qtyInput.value = '1';
          adjustQtyInputWidth(qtyInput, 72);
        };

        actionTd.appendChild(qtyInput);
        actionTd.appendChild(addBtn);
        tr.appendChild(actionTd);

        fragment.appendChild(tr);
      });

      tableBody.appendChild(fragment);

      rowCountEl.textContent = `${totalItems} total match(es)`;

      if (totalItems > PAGE_SIZE) {
        paginationBar.style.display = 'flex';
        pageInfoEl.textContent = `Page ${currentPage} of ${totalPages} (${startIndex + 1}-${endIndex} of ${totalItems})`;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
      } else {
        paginationBar.style.display = 'none';
      }
    }

    // Pagination Click Handlers
    document.getElementById('prevPageBtn').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderTablePage();
      }
    });

    document.getElementById('nextPageBtn').addEventListener('click', () => {
      const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
      if (currentPage < totalPages) {
        currentPage++;
        renderTablePage();
      }
    });

    // Debounced Search Function
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const keyword = e.target.value.toLowerCase().trim();

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (!keyword) {
          filteredRows = [...parsedRows];
        } else {
          filteredRows = parsedRows.filter(item => item.searchStr.includes(keyword));
        }

        currentPage = 1; 
        renderTablePage();
      }, 150); 
    });

    // Add Item to Cart
    function addToCart(item, qty) {
      const itemName = item.colA || 'Unnamed Item';
      const itemDesc = item.colB || '';
      const price = item.price;

      const existingIndex = cart.findIndex(i => i.name === itemName && i.desc === itemDesc);

      if (existingIndex > -1) {
        cart[existingIndex].qty += qty;
      } else {
        cart.push({
          name: itemName,
          desc: itemDesc,
          price: price,
          qty: qty
        });
      }

      renderCart();
    }

    // Render Cart
    function renderCart() {
      const cartItemsDiv = document.getElementById('cartItems');
      const cartSummaryDiv = document.getElementById('cartSummary');
      const clearCartBtn = document.getElementById('clearCartBtn');
      const grandTotalEl = document.getElementById('grandTotal');
      const cartBadge = document.getElementById('cartBadge');

      let totalItemCount = cart.reduce((sum, item) => sum + item.qty, 0);
      cartBadge.textContent = totalItemCount.toLocaleString();

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<div class="empty-cart">Your cart is currently empty.<br>Search items and click "+ Add".</div>';
        cartSummaryDiv.style.display = 'none';
        clearCartBtn.style.display = 'none';
        return;
      }

      cartItemsDiv.innerHTML = '';
      let total = 0;

      cart.forEach((item, idx) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;

        const cartItemEl = document.createElement('div');
        cartItemEl.className = 'cart-item';
        cartItemEl.innerHTML = `
          <div class="cart-item-row">
            <span class="cart-item-title">${escapeHtml(item.name)}</span>
            <span class="price-tag">${formatCurrency(itemTotal)}</span>
          </div>
          ${item.desc ? `<div class="cart-item-desc">${escapeHtml(item.desc)}</div>` : ''}
          <div class="cart-item-row" style="margin-top: 6px;">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem;">
              <span>Qty:</span>
              <input type="number" min="1" value="${item.qty}" class="qty-input cart-qty-input" id="cart-qty-${idx}" style="padding: 4px 6px; font-size: 0.9rem;" onchange="updateCartQty(${idx}, this.value)" oninput="adjustQtyInputWidth(this, 60)">
              <span style="color: var(--text-muted); font-size: 0.80rem;">(${formatCurrency(item.price)} ea)</span>
            </div>
            <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeFromCart(${idx})">Remove</button>
          </div>
        `;
        cartItemsDiv.appendChild(cartItemEl);

        const cartQtyEl = document.getElementById(`cart-qty-${idx}`);
        if (cartQtyEl) adjustQtyInputWidth(cartQtyEl, 60);
      });

      grandTotalEl.textContent = formatCurrency(total);
      cartSummaryDiv.style.display = 'block';
      clearCartBtn.style.display = 'inline-block';
    }

    function updateCartQty(index, newQty) {
      const q = parseInt(newQty);
      if (q > 0) {
        cart[index].qty = q;
      } else {
        cart.splice(index, 1);
      }
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    document.getElementById('clearCartBtn').addEventListener('click', () => {
      cart = [];
      renderCart();
    });

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
